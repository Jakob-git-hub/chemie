<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interaktive Chemie-Lernplattform: 3D-Molekül-Visualisierung, Molrechner, Periodensystem, Quiz." />
  <title>Chemie-Labor • Interaktive Lernplattform</title>
  <!-- THEME SWITCHER -->
  <div class="theme-switcher">
    <label for="theme-select" class="theme-switcher-label">Theme:</label>
    <select id="theme-select" class="theme-switcher-select">
      <option value="default">Default (Light)</option>
      <option value="dark">Dark</option>
      <option value="claude">Claude Calm</option>
    </select>
  </div>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- THEME SCRIPT -->
  <script>
    // Theme logic - pure vanilla JS
    const THEME_KEY = "preferred-theme";
    const root = document.documentElement;

    function applyTheme(theme) {
      root.removeAttribute("data-theme");
      if (theme === "claude") {
        root.setAttribute("data-theme", "claude");
      } else if (theme === "dark") {
        root.classList.add("dark");
      }
      localStorage.setItem(THEME_KEY, theme);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem(THEME_KEY) || "default";
      const select = document.getElementById("theme-select");

      Array.from(select.options).forEach(opt => {
        if (opt.value === saved) opt.selected = true;
      });

      applyTheme(saved);

      select.addEventListener("change", (e) => applyTheme(e.target.value));
    });
  </script>
</body>
</html>
