<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interaktive Chemie-Lernplattform: 3D-Molekül-Visualisierung, Molrechner, Periodensystem, Quiz." />
  <meta name="theme-color" content="#fff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <title>Chemie-Labor • Interaktive Lernplattform</title>
  <!-- Preconnect to PubChem CDN for faster molecule loading -->
  <link rel="preconnect" href="https://pubchem.ncbi.nlm.nih.gov" />
  <!-- Pre-fetch MathJax for formula rendering -->
  <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" as="script" />
  <!-- Accessible theme toggle - moved to UI via SettingsPanel -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Theme initialization - runs synchronously to avoid FOUD flash -->
  <script>
    (function() {
      const THEME_KEY = 'preferred-theme';
      const root = document.documentElement;
      const saved = localStorage.getItem(THEME_KEY);

      // Apply saved theme immediately (before React loads)
      if (saved === 'dark') {
        root.classList.add('dark');
      } else if (saved === 'claude') {
        root.setAttribute('data-theme', 'claude');
      }

      // Respect system preference if no saved preference
      if (!saved) {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const prefersClaude = window.matchMedia('(prefers-color-scheme: dark)').matches &&
                              localStorage.getItem('claude-preference') === 'true';
        if (prefersDark && !prefersClaude) {
          root.classList.add('dark');
        }
      }
    })();
  </script>
</body>
</html>
