name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Ändere bei Bedarf auf deinen Hauptbranch
  workflow_dispatch:  # Ermöglicht manuelles Deploy

permissions:
  pages: write      # Erforderlich für GitHub Pages Deployment
  contents: read    # Für Zugriff auf Repository-Inhalt
  id-token: write   # Für OIDC-Token (deploy-pages)

concurrency:
  group: deploy-group         # Verhindert gleichzeitige Deploy-Aktionen
  cancel-in-progress: true   # Stellt laufende Deploy-Aktionen ein

jobs:
  # ── 1. BUILD ───────────────────────────────────────────────
  # Baut die Seite komplett in CI (npm ci + npm run build → docs/).
  # Ein lokaler Build vor dem Commit ist NICHT nötig – docs/ ist in
  # .gitignore und wird nicht ins Repo committet.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build website (npm run build → docs/)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # ── 2. DEPLOY ──────────────────────────────────────────────
  # Wird erst nach erfolgreichem Build ausgeführt und veröffentlicht
  # das Artefakt auf GitHub Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
