name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Ändere bei Bedarf auf deinen Hauptbranch
  workflow_dispatch:  # Ermöglicht manuelles Deploy

permissions:
  pages: write      # Erforderlich für GitHub Pages Deployment
  contents: read    # Für Zugriff auf Repository-Inhalt
  id-token: write   # Für OIDC-Token (deploy-pages)

concurrency:
  group: deploy-group         # Verhindert gleichzeitige Deploy-Aktionen
  cancel-in-progress: true   # Stellt laufende Deploy-Aktionen ein

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Artefakt hochladen (docs/ Ordner)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # 3. Auf GitHub Pages deployen
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
